[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Upload
upload_speed   = 921600
upload_protocol = esptool

; Serial monitor
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder  ; Decodes crash stack traces

; Build
board_build.filesystem = LittleFS
build_flags =
    -DCORE_DEBUG_LEVEL=3    ; Remove this line before production build
    -DCONFIG_MDNS_ENABLED=1
   ; -DENABLE_DEBUG_UTILS=1 ; Custom flag to enable debug utilities in code
    -I$PROJECT_CORE_DIR/packages/framework-arduinoespressif32/tools/sdk/esp32/include
    -I$PROJECT_CORE_DIR/packages/framework-arduinoespressif32/tools/sdk/esp32/include/esp_wifi
    -I$PROJECT_CORE_DIR/packages/framework-arduinoespressif32/tools/sdk/esp32/include/esp_event
    -I$PROJECT_CORE_DIR/packages/framework-arduinoespressif32/tools/sdk/esp32/include/mqtt
    
; Libraries — corrected to match your actual codebase
lib_deps =
    makuna/RTC @ ^2.3.6
    bblanchon/ArduinoJson @ ^7.2.0
    adafruit/RTClib @ ^2.1.4
; OTA upload (uncomment when device is on WiFi)
; [env:esp32dev_ota]
; extends         = env:esp32dev
; upload_protocol = espota
; upload_port     = 192.168.4.1

;[env:native]
;platform = native
;test_framework = unity
;test_build_src = no
;test_ignore = test_rtc_handler.c, test_hello_world.c, test_hello_world_runner.c, test_storage_manager.c, test_web_server.c, test_wifi_manager.c