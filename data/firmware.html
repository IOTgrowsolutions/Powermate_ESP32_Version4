<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerMate Firmware Update</title>
    <style>:root{--p:#3498db;--d:#e74c3c;--g:#2ecc71;--r:8px}body{font-family:Arial,sans-serif;line-height:1.6;margin:0;padding:20px;background:#f4f4f4;color:#333;transition:background-color .3s,color .3s}body.dark-mode{background:#121212;color:#e0e0e0}.container{max-width:600px;margin:0 auto}.card{background:white;border-radius:var(--r);box-shadow:0 2px 4px rgba(0,0,0,.1);padding:20px;margin-bottom:20px}.dark-mode .card{background:#1e1e1e;box-shadow:0 2px 4px rgba(0,0,0,.2)}.card-header{margin-bottom:20px}.card-title{font-size:24px;margin:0;color:#2c3e50}.dark-mode .card-title{color:#ecf0f1}.upload-form{display:flex;flex-direction:column;gap:15px}.file-input{padding:10px;border:2px dashed #3498db;border-radius:4px;cursor:pointer}.dark-mode .file-input{border-color:#2980b9;color:#e0e0e0}.button{padding:12px 20px;background:var(--p);color:white;border:none;border-radius:4px;cursor:pointer;font-size:16px;transition:background-color .3s}.button:hover{background:#2980b9}.button:disabled{background:#bdc3c7;cursor:not-allowed}.progress{margin-top:20px;padding:10px;background:#f8f9fa;border-radius:4px;text-align:center}.dark-mode .progress{background:#2c2c2c}.warning{color:var(--d);margin-top:10px;font-size:14px}.back-button{display:inline-block;margin-top:20px;color:var(--p);text-decoration:none}.update-type-selector{display:flex;gap:20px;margin-bottom:15px;justify-content:center}.update-type-selector label{display:flex;align-items:center;gap:5px;cursor:pointer}@media(max-width:768px){.container{padding:10px}.card{padding:15px}}</style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1 class="card-title">Firmware Update</h1>
            </div>
            <form method='POST' action='/update' enctype='multipart/form-data' id='upload_form' class="upload-form">

                <div class="update-type-selector">
                    <label>
                        <input type="radio" name="update_type" value="firmware" checked>
                        <span>Firmware (firmware.bin)</span>
                    </label>
                    <label>
                        <input type="radio" name="update_type" value="filesystem">
                        <span>Filesystem (LittleFS.bin)</span>
                    </label>
                </div>
                <input type='file' name='update' accept='.bin' class="file-input" required>
                <button type='submit' class="button" id="submitBtn">Update Now</button>
            </form>
            <div id='progress' class="progress"></div>
            <p class="warning">Warning: Do not power off the device during update!</p>
            <a href="/" class="back-button">← Back to Dashboard</a>
        </div>
    </div>
    <script>const darkMode=localStorage.getItem('darkMode')==='true';if(darkMode)document.body.classList.add('dark-mode');const form=document.getElementById('upload_form'),progressDiv=document.getElementById('progress'),submitBtn=document.getElementById('submitBtn');form.onsubmit=function(e){e.preventDefault();submitBtn.disabled=true;progressDiv.textContent='Starting update...';const data=new FormData(form),xhr=new XMLHttpRequest();xhr.upload.onprogress=function(e){if(e.lengthComputable){const percent=Math.round((e.loaded/e.total)*100);progressDiv.textContent=`Uploading: ${percent}%`}};xhr.onload=function(){if(xhr.status===200){progressDiv.textContent='Update successful! Redirecting...';progressDiv.style.color='var(--g)';setTimeout(()=>{window.location.href='/'},5000)}else{progressDiv.textContent=`Error: ${xhr.statusText}`;progressDiv.style.color='var(--d)';submitBtn.disabled=false}};xhr.onerror=function(){progressDiv.textContent='Update failed! Please try again.';progressDiv.style.color='var(--d)';submitBtn.disabled=false};xhr.open('POST','/update',true);xhr.send(data)}</script>
</body>
</html>
